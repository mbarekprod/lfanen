<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Fanen Wheel Casino</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:url('https://images.unsplash.com/photo-1600891964092-4316c288032e') center/cover;
  text-align:center;
  color:white; 
}

/* overlay dark like your design */
.overlay{
  background:rgba(0,0,0,0.75);
  min-height:100vh;
  padding:20px;
}

/* title */
h1{
  color:#ffcc00;
  font-size:32px;
  text-shadow:0 0 10px #ffcc00;
}

/* wheel container */
.wheel-container{
  position:relative;
  width:340px;
  height:340px;
  margin:30px auto;
}

/* pointer */
.pointer{
  position:absolute;
  top:-15px;
  left:50%;
  transform:translateX(-50%);
  font-size:40px;
  color:#ff3b3b;
  z-index:10;
  filter:drop-shadow(0 0 5px black);
}

/* wheel */
.wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:10px solid gold;
  overflow:hidden;
  position:relative;
  transition:transform 4s cubic-bezier(0.17,0.67,0.83,1);
  box-shadow:0 0 25px gold;
}

/* segments */
.segment{
  position:absolute;
  width:50%;
  height:50%;
  transform-origin:100% 100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:14px;
  color:#111;
}

/* button */
button{
  background:linear-gradient(45deg,#ffcc00,#ff8800);
  border:none;
  padding:15px 35px;
  font-size:18px;
  border-radius:12px;
  cursor:pointer;
  margin-top:20px;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
}

#result{
  margin-top:20px;
  font-size:28px;
  color:#00ff99;
  text-shadow:0 0 10px #00ff99;
}

/* lights effect */
.light{
  position:absolute;
  width:10px;
  height:10px;
  background:gold;
  border-radius:50%;
  box-shadow:0 0 15px gold;
  animation:blink 1s infinite alternate;
}

@keyframes blink{
  from{opacity:0.3;}
  to{opacity:1;}
}
</style>
</head>

<body>

<div class="overlay">

<h1>🎡 EL FANEN CASINO WHEEL 🎡</h1>

<div class="wheel-container">
  <div class="pointer">▼</div>
  <div class="wheel" id="wheel"></div>
</div>

<button onclick="spinWheel()">🎯 DÉFIER L’AJJALE</button>

<div id="result"></div>

<!-- sound -->
<audio id="spinSound" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>

</div>

<script>
const segments = [

  "💧 دابوزة ماء",
  "🍟 بورسيون فرييت",
  "🥤 قازوزة",
  "🎟️ %روميز10",
  "🔄 شركة صغيرة سترهة ربي"
];

const wheel = document.getElementById("wheel");
const result = document.getElementById("result");
const sound = document.getElementById("spinSound");

let rotation = 0;

/* build wheel */
function buildWheel(){
  const angle = 360 / segments.length;

  segments.forEach((text,i)=>{
    const seg = document.createElement("div");

    seg.className = "segment";
    seg.style.transform = `rotate(${i * angle}deg) skewY(${90-angle}deg)`;
    seg.style.background = i % 2 ? "#ffcc00" : "#ff9900";

    seg.innerHTML = `
      <div style="
        transform: skewY(-${90-angle}deg) rotate(${angle/2}deg);
        text-align:center;
      ">
        ${text}
      </div>
    `;

    wheel.appendChild(seg);
  });
}

buildWheel();

/* spin PRO + sound */
function spinWheel(){

  const index = Math.floor(Math.random()*segments.length);
  const anglePer = 360 / segments.length;
  const stopAngle = index * anglePer;

  rotation += 5*360 + (360 - stopAngle);

  wheel.style.transform = `rotate(${rotation}deg)`;

  sound.play();

  setTimeout(()=>{

    result.innerHTML =
      "🎉 <b>FÉLICITATIONS!</b><br><br>" +
      segments[index] +
      "<br><br>📱 Montrez ça au caissier";

  },4000);
}
</script>

</body>
</html>
